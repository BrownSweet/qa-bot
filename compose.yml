services:
  app:
    build:
      context: .
    image: qa-robot:local
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_TYPE: "${DB_TYPE:-sqlite}"
      SQLITE_PATH: /app/data/qabot.db
      MYSQL_HOST: "${MYSQL_HOST:-mysql}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-qabot}"
      MYSQL_USER: "${MYSQL_USER:-qabot}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me}"
      SECRET_KEY: "${SECRET_KEY:-dev-secret-key-change-me}"
      AES_KEY: "${AES_KEY:-dev-aes-key-change-me}"
      TOKEN_EXPIRE_HOURS: "${TOKEN_EXPIRE_HOURS:-24}"
      TOKEN_REMEMBER_HOURS: "${TOKEN_REMEMBER_HOURS:-720}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_API_URL: "${DEEPSEEK_API_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-root-password}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-qabot}"
      MYSQL_USER: "${MYSQL_USER:-qabot}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app-data:
  mysql-data:
